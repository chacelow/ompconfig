marketplaces:
  - name: unslop-marketplace
    source: MohamedAbdallah-14/unslop

plugins:
  - id: unslop@unslop-marketplace
    scope: user
    verifiedVersion: 0.7.0

skillSources:
  - source: vinvcn/mattpocock-skills-zh-CN
    scope: global
    agent: universal
    skills: all
    install: npx skills@latest add vinvcn/mattpocock-skills-zh-CN --global --agent universal --skill '*' --copy --yes
  - source: amosblomqvist/pi-config
    path: skills/youtube-transcript
    scope: global
    runtimeDependency: yt-dlp
    installDependency: uv tool install yt-dlp
    notes: Vendored and adapted for Universal/OMP paths and multilingual caption selection.

extensions:
  - name: observation-memory
    scope: user
    source: local
    entry: extensions/observation-memory/src/index.ts
    default: off
    commands:
      - /om [on|off|toggle|status|compact|consolidate|default|help]
    notes: |
      pi-observational-memory 的 in-process 移植：observer / consolidator
      通过 OMP native subagent 触发（`pi.pi.runSubprocess`），@observations 和
      @consolidator role 通过 seedDefaultRoles 运行时注入到 /model UI。
      默认 per-session OFF；`/om default on` 持久化到 settings.json。

notes:
  - All 35 Matt Pocock Chinese skills are vendored under skills/ and enabled by omp/agent/config.yml.
  - ask-matt, grilling, and prototype contain personal overrides; the remaining skills are full upstream snapshots.
  - New-machine restore uses the vendored snapshot and does not require the upstream repository; the install command above is retained only for manual upstream refreshes.
  - zhihu, crawl4ai, make-interfaces-feel-better, and vercel-react-best-practices are discovered from external user skill sources and are not vendored here.
